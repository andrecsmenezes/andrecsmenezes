name: Refresh profile stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render light stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&show=reviews,prs_merged&custom_title=GitHub%20at%20a%20glance&bg_color=fdf9ee&title_color=9d1348&text_color=171418&icon_color=f6535f&hide_border=true
          path: generated/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render dark stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&include_all_commits=true&show=reviews,prs_merged&custom_title=GitHub%20at%20a%20glance&bg_color=171418&title_color=f6535f&text_color=fffdf8&icon_color=f68543&hide_border=true
          path: generated/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed cards
        run: |
          if [ -z "$(git status --porcelain -- generated/)" ]; then
            echo "No stats changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git commit -m "chore: refresh profile stats"
          git push
