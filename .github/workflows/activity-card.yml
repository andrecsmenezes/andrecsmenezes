name: Refresh branded activity card
# Builds a branded card from GitHub's publicly visible contribution calendar.

on:
  workflow_dispatch:
  schedule:
    - cron: "9 6 * * *"
  push:
    paths:
      - "scripts/build_activity_card.py"
      - ".github/workflows/activity-card.yml"

permissions:
  contents: write

concurrency:
  group: profile-activity-card
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ACSMTI activity cards
        run: python scripts/build_activity_card.py

      - name: Commit refreshed activity cards
        run: |
          if [ -z "$(git status --porcelain -- generated/activity-*.svg)" ]; then
            echo "No activity changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/activity-*.svg
          git commit -m "chore: refresh branded activity card"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
