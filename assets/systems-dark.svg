<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Systems in motion">
<defs>
<linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f68543"/><stop offset=".42" stop-color="#f6535f"/><stop offset=".72" stop-color="#ef1f63"/><stop offset="1" stop-color="#9d1348"/></linearGradient>
<path id="p1" d="M150 165 C230 165 245 95 330 95"/>
<path id="p2" d="M370 95 C455 95 480 95 565 95"/>
<path id="p3" d="M350 120 C350 170 350 180 350 220"/>
<path id="p4" d="M605 95 C700 95 730 165 810 165"/>
<path id="p5" d="M390 220 C470 220 500 220 565 220"/>
<path id="p6" d="M605 220 C700 220 730 165 810 165"/>
</defs>
<rect width="1200" height="310" rx="30" fill="#171418"/>
<rect x="1" y="1" width="1198" height="308" rx="29" fill="none" stroke="#fffdf8" stroke-opacity=".09"/>
<text x="48" y="52" fill="#c9bec1" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">HOW I USUALLY SEE A SYSTEM</text>
<text x="48" y="84" fill="#fffdf8" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="710">Not as a stack list. As boundaries, data, recovery and delivery.</text>
<g fill="none" stroke="#fffdf8" stroke-opacity=".16" stroke-width="3"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/><use href="#p5"/><use href="#p6"/></g>
<g font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif">
<g><rect x="80" y="130" width="140" height="70" rx="20" fill="#211b20" stroke="#f68543" stroke-width="2"/><text x="150" y="172" text-anchor="middle" fill="#fffdf8" font-size="16" font-weight="700">PRODUCT</text></g>
<g><rect x="280" y="60" width="140" height="70" rx="20" fill="#211b20" stroke="#f6535f" stroke-width="2"/><text x="350" y="102" text-anchor="middle" fill="#fffdf8" font-size="16" font-weight="700">API</text></g>
<g><rect x="520" y="60" width="140" height="70" rx="20" fill="#211b20" stroke="#ef1f63" stroke-width="2"/><text x="590" y="102" text-anchor="middle" fill="#fffdf8" font-size="16" font-weight="700">DATA</text></g>
<g><rect x="280" y="185" width="140" height="70" rx="20" fill="#211b20" stroke="#9d1348" stroke-width="2"/><text x="350" y="227" text-anchor="middle" fill="#fffdf8" font-size="16" font-weight="700">WORKERS</text></g>
<g><rect x="520" y="185" width="140" height="70" rx="20" fill="#211b20" stroke="#f68543" stroke-width="2"/><text x="590" y="227" text-anchor="middle" fill="#fffdf8" font-size="16" font-weight="700">CI / OPS</text></g>
<g><rect x="800" y="130" width="140" height="70" rx="20" fill="#211b20" stroke="#ef1f63" stroke-width="2"/><text x="870" y="172" text-anchor="middle" fill="#fffdf8" font-size="16" font-weight="700">SHIP</text></g>
</g>
<circle r="6" fill="#f68543"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
<circle r="6" fill="#f6535f"><animateMotion dur="3.2s" begin=".5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
<circle r="6" fill="#9d1348"><animateMotion dur="3.5s" begin=".8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
<circle r="6" fill="#ef1f63"><animateMotion dur="4.1s" begin=".3s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
<circle r="6" fill="#f68543"><animateMotion dur="3.6s" begin="1.1s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
<circle r="6" fill="#ef1f63"><animateMotion dur="4.0s" begin=".7s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
<text x="990" y="145" fill="#c9bec1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">read first</text>
<text x="990" y="166" fill="#c9bec1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">change in pieces</text>
<text x="990" y="187" fill="#c9bec1" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">keep a way back</text>
</svg>