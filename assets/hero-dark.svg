<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="André Menezes — Tech Lead and Software Engineer">
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#f68543"><animate attributeName="stop-color" values="#f68543;#f6535f;#f68543" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset=".48" stop-color="#f6535f"><animate attributeName="stop-color" values="#f6535f;#ef1f63;#f6535f" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#9d1348"><animate attributeName="stop-color" values="#9d1348;#ef1f63;#9d1348" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(1045 80) rotate(140) scale(350 280)">
    <stop stop-color="#ef1f63" stop-opacity=".22"/><stop offset="1" stop-color="#ef1f63" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9d1348" flood-opacity=".18"/></filter>
  </defs>
<rect width="1200" height="330" rx="34" fill="#171418"/>
<rect width="1200" height="330" rx="34" fill="url(#wash)"/>
<rect x="1" y="1" width="1198" height="328" rx="33" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<rect x="58" y="58" width="8" height="214" rx="4" fill="url(#brand)"/>
<text x="100" y="122" fill="#fffdf8" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="50" font-weight="780">ANDRÉ MENEZES</text>
<text x="102" y="166" fill="#c9bec1" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" letter-spacing="2.5">TECH LEAD · SOFTWARE ENGINEER · PRODUCT &amp; ARCHITECTURE</text>
<text x="102" y="222" fill="#fffdf8" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24">I build software from the first sketch to production.</text>
<text x="102" y="260" fill="#c9bec1" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17">Products, platforms, automation and the boring parts that keep them alive.</text>
<g transform="translate(900 65)" filter="url(#shadow)">
  <rect width="225" height="200" rx="42" fill="#211b20" stroke="#ffffff" stroke-opacity=".08"/>
  <circle cx="112.5" cy="100" r="74" fill="none" stroke="url(#brand)" stroke-opacity=".26" stroke-width="2">
    <animate attributeName="r" values="68;78;68" dur="5.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".15;.38;.15" dur="5.8s" repeatCount="indefinite"/>
  </circle>
  <image href="data:image/webp;base64," x="36" y="48" width="153" height="105" preserveAspectRatio="xMidYMid meet">
    <animateTransform attributeName="transform" type="translate" values="0 2;0 -4;0 2" dur="4.8s" repeatCount="indefinite"/>
  </image>
  <circle cx="36" cy="42" r="6" fill="#f68543"><animate attributeName="cy" values="42;52;42" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="192" cy="52" r="6" fill="#f6535f"><animate attributeName="cx" values="192;184;192" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="189" cy="166" r="6" fill="#ef1f63"><animate attributeName="cy" values="166;155;166" dur="4.4s" repeatCount="indefinite"/></circle>
</g>
</svg>