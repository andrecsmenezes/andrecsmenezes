  <g><rect x="315" y="180" width="150" height="70" rx="20" fill="#fffdf8" stroke="#f6535f" stroke-width="2"/><text x="390" y="222" text-anchor="middle" fill="#171418" font-size="16" font-weight="700">API</text></g>
  <g><rect x="560" y="180" width="150" height="70" rx="20" fill="#fffdf8" stroke="#ef1f63" stroke-width="2"/><text x="635" y="222" text-anchor="middle" fill="#171418" font-size="16" font-weight="700">DATA</text></g>
  <g><rect x="315" y="315" width="150" height="70" rx="20" fill="#fffdf8" stroke="#9d1348" stroke-width="2"/><text x="390" y="357" text-anchor="middle" fill="#171418" font-size="16" font-weight="700">WORKERS</text></g>
  <g><rect x="560" y="315" width="150" height="70" rx="20" fill="#fffdf8" stroke="#f68543" stroke-width="2"/><text x="635" y="357" text-anchor="middle" fill="#171418" font-size="16" font-weight="700">CI / OPS</text></g>
  <g><rect x="820" y="225" width="145" height="70" rx="20" fill="#fffdf8" stroke="#ef1f63" stroke-width="2"/><text x="892.5" y="267" text-anchor="middle" fill="#171418" font-size="16" font-weight="700">SHIP</text></g>
</g>
<g fill="none" stroke="#171418" stroke-opacity=".15" stroke-width="3" stroke-linecap="round"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/><use href="#p5"/><use href="#p6"/></g>
