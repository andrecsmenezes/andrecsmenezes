<text x="48" y="52" fill="#625b5b" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="650" letter-spacing="1.5">HOW I USUALLY SEE A SYSTEM</text>
<text x="48" y="90" fill="#171418" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="710">Not as a stack list. As boundaries, data, recovery and delivery.</text>
<line x1="48" y1="126" x2="1152" y2="126" stroke="#171418" stroke-opacity=".08"/>
<g font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif">
