<text x="102" y="222" fill="#171418" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="24">I build software from the first sketch to production.</text>
<text x="102" y="260" fill="#625b5b" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17">Products, platforms, automation and the boring parts that keep them alive.</text>
